<!doctype html>
<!--
  Source for assets/og.png — the card that unfurls when the site is linked.
  Rendered at exactly 1200x630 by scripts/render-og.mjs; edit here, re-run that.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{font-family:'Hanken Grotesk';src:url('../fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2-variations');font-weight:100 900}
  @font-face{font-family:'Bricolage Grotesque';src:url('../fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');font-weight:200 800}
  @font-face{font-family:'Spline Sans Mono';src:url('../fonts/spline-sans-mono-latin-wght-normal.woff2') format('woff2-variations');font-weight:300 700}
  *{margin:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#0b0c0f;
    background-image:radial-gradient(circle,rgba(244,242,236,.05) 1px,transparent 1.3px);
    background-size:26px 26px;
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:#c9c7bf;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:absolute;top:-260px;left:50%;transform:translateX(-50%);width:1100px;height:700px;
        background:radial-gradient(closest-side,rgba(255,92,31,.16),transparent 68%);pointer-events:none}
  .pad{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:13px;font-family:'Bricolage Grotesque';font-size:27px;
         font-weight:640;color:#f4f2ec;letter-spacing:-.02em}
  h1{font-family:'Bricolage Grotesque';font-size:76px;line-height:1.03;letter-spacing:-.035em;
     color:#f4f2ec;font-weight:700;margin-top:56px;max-width:15ch}
  .heat{background:linear-gradient(120deg,#ff5c1f,#ffb454);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{margin-top:24px;font-size:27px;color:#8f8e86;max-width:36ch;line-height:1.42}
  .foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:20px;color:#5c5b55}
  .chip{border:1px solid rgba(244,242,236,.14);border-radius:9px;padding:7px 15px;color:#c9c7bf;font-size:19px}
  /* the document, cropped at the right edge — the thing the product acts on */
  .doc{position:absolute;right:-90px;bottom:-70px;width:520px;background:#fff;border-radius:10px;
       box-shadow:0 40px 90px rgba(0,0,0,.66),0 0 0 1px rgba(244,242,236,.08);padding:34px 38px;
       transform:rotate(-6.5deg)}
  .doc .h{font-weight:700;color:#17171b;font-size:19px;letter-spacing:.01em}
  .doc .r{display:flex;justify-content:space-between;color:#3c3a33;font-size:15px;padding:11px 0;border-bottom:1px solid #eceae4}
  .doc .sel{position:relative;display:inline-block;padding:1px 5px}
  .doc .sel::after{content:'';position:absolute;inset:-4px -7px;border:1.6px dashed #ff5c1f;border-radius:5px}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="doc">
    <div class="h">IRONWORKS SUPPLY CO.</div>
    <div style="height:16px"></div>
    <div class="r"><span>Anvil, 35 kg — forged steel</span><span>820.00</span></div>
    <div class="r"><span>Delivery: <span class="sel">22 Graf Ignatiev St</span></span><span>0.00</span></div>
    <div class="r" style="border:none"><span style="font-weight:700;color:#17171b">Total due</span><span style="color:#ff5c1f;font-weight:700">EUR 1,457.00</span></div>
  </div>
  <div class="pad">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#FF5C1F"/><stop offset="1" stop-color="#FFB454"/></linearGradient></defs><path fill="#EFECE4" d="M10 2 H19 L26 9 V28 Q26 30 24 30 H10 Q8 30 8 28 V4 Q8 2 10 2 Z"/><path fill="#D7D2C6" d="M19 2 L26 9 H19 Z"/><rect x="11" y="11" width="12" height="1.7" rx="0.85" fill="#B9B3A6"/><rect x="11" y="15" width="9" height="1.7" rx="0.85" fill="#B9B3A6"/><path fill="url(#g)" d="M11 19 H21 L21 24 H11 Z"/></svg>
      Reshaped<span style="color:#ff5c1f">PDF</span>
    </div>
    <h1>Every PDF is<br />just material.<br /><span class="heat">Reshape it.</span></h1>
    <p class="sub">Edit printed text in its own typeface. Nothing leaves your machine.</p>
    <div class="foot">
      <span class="chip">macOS · Windows · Linux</span>
      <span class="chip">Browser</span>
      <span>Free &amp; open source</span>
    </div>
  </div>
</body>
</html>
